<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorium 6 - Supabase Blog</title>
</head>
<body class="bg-gray-50 min-h-screen p-8 text-gray-800">

    <div class="max-w-3xl mx-auto space-y-12">

        <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b pb-6">
            <h1 class="text-3xl font-bold text-gray-900">Artykuly z bazy Supabase</h1>

            <div class="mt-4 sm:mt-0">
                <label for="sortSelect" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Sortowanie</label>
                <select id="sortSelect" class="bg-white border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="created_at.desc">po dacie malejąco</option>
                    <option value="created_at.asc">po dacie rosnąco</option>
                    <option value="title.asc">po nazwie alfabetycznie</option>
                </select>
            </div>
        </header>

        <main id="articlesContainer" class="space-y-6">
            <p class="text-gray-500 animate-pulse">Ladowanie artykulow...</p>
        </main>

        <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold mb-4 text-gray-900">Dodaj nowy artykul</h2>

            <form id="articleForm" class="space-y-4">
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700">Tytul</label>
                    <input type="text" id="title" required class="mt-1 block w-full rounded border border-gray-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>

                <div>
                    <label for="subtitle" class="block text-sm font-medium text-gray-700">Podtytul</label>
                    <input type="text" id="subtitle" required class="mt-1 block w-full rounded border border-gray-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>

                <div>
                    <label for="author" class="block text-sm font-medium text-gray-700">Autor</label>
                    <input type="text" id="author" required class="mt-1 block w-full rounded border border-gray-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>

                <div>
                    <label for="createdAt" class="block text-sm font-medium text-gray-700">Data utworzenia (opcjonalnie)</label>
                    <input type="datetime-local" id="createdAt" class="mt-1 block w-full rounded border border-gray-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>

                <div>
                    <label for="content" class="block text-sm font-medium text-gray-700">Tresc</label>
                    <textarea id="content" rows="5" required class="mt-1 block w-full rounded border border-gray-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded hover:bg-blue-700 transition shadow-sm text-sm">
                    Opublikuj artykul
                </button>
            </form>
        </section>

    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
